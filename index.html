      const mk=(imgs)=>{const id='p'+Date.now(),img=imgs[0]?imgs[0].t:'',hi=imgs[0]?imgs[0].hi:'';S.products.push({id,hi,imgs,code:code.value.trim(),name:nm.value.trim()||code.value.trim(),cat:ct.value.trim(),sizes:(S.catSizes[ct.value.trim()]||[]).filter(s=>picked.has(s)),loc:loc.value.trim(),price:pr.value.trim(),img});save();render()};
      const fs=[...file.files];if(!fs.length){mk([]);return}
      if(upBusy)return;upBusy=true;const u=document.getElementById('ust');if(u)u.textContent='Uploading photos… please wait';
      (async()=>{const out=[];for(const f of fs){out.push(await new Promise(res=>procImg(f,async(th,b)=>res(await upPhoto(b,th)))))}upBusy=false;mk(out)})()}},'Save product')));
  return h('div',{},add,h('div',{class:'grid'},S.products.map(p=>h('div',{class:'card'},ph(p),h('div',{class:'ci'},h('b',{},p.name),h('small',{},p.code+' · '+p.cat+' · '+p.loc),h('div',{class:'mu'},'Tap a size to mark it sold out'),h('div',{class:'sz'},p.sizes.map(s=>{const o=()=>(p.out||[]).includes(s),b=h('button',{class:o()?'out':'on'},s);b.onclick=()=>{p.out=o()?p.out.filter(x=>x!==s):[...(p.out||[]),s];b.className=o()?'out':'on';save()};return b})),h('input',{value:p.price||'',placeholder:'Price ₹',inputmode:'numeric',style:'margin-top:8px',onchange:e=>{p.price=e.target.value.trim();save()}}),
    photosOf(p).length?h('div',{class:'th'},photosOf(p).map((x,i)=>h('div',{},h('div',Object.assign({class:'ph'},img({img:x.t}))),h('button',{class:'btn o s',onclick:()=>{const c=photosOf(p).slice();c.splice(i,1);p.imgs=c;p.img=c[0]?c[0].t:'';p.hi=c[0]?c[0].hi:'';save();render()}},'✕')))):'',
    h('button',{class:'btn o s',onclick:()=>{const fi=h('input',{type:'file',accept:'image/*',multiple:'multiple'});fi.onchange=async()=>{const fs=[...fi.files];if(!fs.length)return;const cur=photosOf(p).slice();for(const f of fs){cur.push(await new Promise(res=>procImg(f,async(th,b)=>res(await upPhoto(b,th)))))}p.imgs=cur;p.img=cur[0].t;p.hi=cur[0].hi;save();render()};fi.click()}},'Add photos'),' ',h('button',{class:'btn o s',onclick:()=>{if(confirm('Delete '+p.code+'?')){S.products=S.products.filter(x=>x.id!==p.id);save();render()}}},'Delete'))))));
}
render();
</script>
